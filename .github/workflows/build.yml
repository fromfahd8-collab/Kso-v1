name: Build KSO Downloader v1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Install NSIS
      run: choco install nsis -y
        
    - name: Build Portable EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "KSO_Downloader_Portable" --icon=app_icon.ico --add-data "lang.json;." --add-data "config.json;." main.py
        
    - name: Create Installer with NSIS
      run: |
        echo "!define APPNAME 'KSO Downloader PRO'" > installer.nsi
        echo "!define COMPANYNAME 'KSO'" >> installer.nsi
        echo "!define DESCRIPTION 'YouTube Downloader Turbo Ultra'" >> installer.nsi
        echo "!define VERSION '1.0.0'" >> installer.nsi
        echo "!define INSTALLER_NAME 'KSO_Downloader_Setup.exe'" >> installer.nsi
        echo "OutFile \${INSTALLER_NAME}" >> installer.nsi
        echo "InstallDir \$PROGRAMFILES\\\${APPNAME}" >> installer.nsi
        echo "Page directory" >> installer.nsi
        echo "Page instfiles" >> installer.nsi
        echo "Section" >> installer.nsi
        echo "SetOutPath \$INSTDIR" >> installer.nsi
        echo "File /r dist\\KSO_Downloader_Portable.exe" >> installer.nsi
        echo "CreateShortcut '\$DESKTOP\\\${APPNAME}.lnk' '\$INSTDIR\\KSO_Downloader_Portable.exe'" >> installer.nsi
        echo "SectionEnd" >> installer.nsi
        makensis installer.nsi
        
    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: KSO-Portable-Windows
        path: dist/KSO_Downloader_Portable.exe
        
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: KSO-Setup-Windows
        path: KSO_Downloader_Setup.exe
