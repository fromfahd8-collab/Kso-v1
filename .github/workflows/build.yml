name: Build KSO Download Turbo Ultra v1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }

    - name: Create Required Files
      run: |
        echo {} > config.json
        echo {\"ar\":{},\"en\":{}} > lang.json

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Convert Icon to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Build Portable EXE
      run: pyinstaller --onefile --windowed --name "KSO_Download_Turbo_Ultra_v1" --icon=icon.ico --add-data "lang.json;." --add-data "config.json;." --collect-all yt_dlp --collect-all customtkinter main.py

    - name: Build Installer EXE
      shell: cmd
      run: |
        echo!define APPNAME "KSO Download Turbo Ultra v1" > installer.nsi
        echo OutFile KSO_Download_Turbo_Ultra_v1_Setup.exe >> installer.nsi
        echo InstallDir "$PROGRAMFILES\${APPNAME}" >> installer.nsi
        echo Icon icon.ico >> installer.nsi
        echo Page directory >> installer.nsi
        echo Page instfiles >> installer.nsi
        echo Section >> installer.nsi
        echo SetOutPath $INSTDIR >> installer.nsi
        echo File /r dist\* >> installer.nsi
        echo File lang.json >> installer.nsi
        echo File config.json >> installer.nsi
        echo File icon.ico >> installer.nsi
        echo CreateShortcut "$DESKTOP\${APPNAME}.lnk" "$INSTDIR\KSO_Download_Turbo_Ultra_v1.exe" >> installer.nsi
        echo SectionEnd >> installer.nsi
        "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

    - name: Build Report
      run: |
        echo ================== BUILD REPORT ==================
        echo.
        echo [1] File Sizes:
        powershell -command "Get-ChildItem dist, *.exe | Select-Object Name, @{Name='Size_MB';Expression={::Round($_.Length / 1MB, 2)}}"
        echo ==================================================

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KSO-Download-Turbo-Ultra-v1
        path: |
          dist/KSO_Download_Turbo_Ultra_v1.exe
          KSO_Download_Turbo_Ultra_v1_Setup.exe
