name: Build KSO Download Turbo Ultra v1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }

    - name: Create Required Files
      run: |
        echo {} > config.json
        echo {\"ar\":{},\"en\":{}} > lang.json
        echo "Icon" > app_icon.ico

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install NSIS
      run: choco install nsis -y

    - name: Build Portable EXE
      run: pyinstaller --onefile --windowed --name "KSO_Download_Turbo_Ultra_v1" --icon=app_icon.ico --add-data "lang.json;." --add-data "config.json;." main.py

    - name: Build Installer EXE
      run: |
        echo "!define APPNAME 'KSO Download Turbo Ultra v1'" > installer.nsi
        echo "!define COMPANYNAME 'KSO'" >> installer.nsi
        echo "OutFile KSO_Download_Turbo_Ultra_v1_Setup.exe" >> installer.nsi
        echo "InstallDir \$PROGRAMFILES\\\${APPNAME}" >> installer.nsi
        echo "Page directory" >> installer.nsi
        echo "Page instfiles" >> installer.nsi
        echo "Section" >> installer.nsi
        echo "SetOutPath \$INSTDIR" >> installer.nsi
        echo "File /r dist\\*" >> installer.nsi
        echo "File lang.json" >> installer.nsi
        echo "File config.json" >> installer.nsi
        echo "CreateShortcut '\$DESKTOP\\\${APPNAME}.lnk' '\$INSTDIR\\KSO_Download_Turbo_Ultra_v1.exe'" >> installer.nsi
        echo "SectionEnd" >> installer.nsi
        makensis installer.nsi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KSO-Download-Turbo-Ultra-v1
        path: |
          dist/KSO_Download_Turbo_Ultra_v1.exe
          KSO_Download_Turbo_Ultra_v1_Setup.exe
